pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{ts,tsx,js,jsx}"
      run: npx oxlint --fix {staged_files}
      stage_fixed: true
    format:
      glob: "*.{ts,tsx,js,jsx,json,css,md,html}"
      run: npx prettier --write {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    conventional:
      run: cog verify --file {1}
